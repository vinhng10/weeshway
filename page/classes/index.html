<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeeshWay — View Class</title>
    <meta
      name="description"
      content="Open this class in the WeeshWay app to book your spot."
    />
    <link rel="icon" href="/assets/icon.webp" />
    <link rel="stylesheet" href="/style.css" />
    <style>
      .redirect-page {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        gap: 1.5rem;
      }
      .redirect-page img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      .redirect-page h1 {
        font-size: 1.5rem;
        margin: 0;
      }
      .redirect-page p {
        color: #888;
        margin: 0;
        max-width: 320px;
      }
      .redirect-page .open-app-btn {
        display: inline-block;
        background: #0C0C0C;
        color: #fff;
        padding: 0.875rem 2rem;
        border-radius: 12px;
        text-decoration: none;
        font-size: 1rem;
        font-weight: 600;
      }
      .redirect-page .store-buttons {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        justify-content: center;
      }
    </style>
    <script>
      (function () {
        var parts = window.location.pathname.split("/").filter(Boolean);
        var classId = parts.length > 1 ? parts[parts.length - 1] : null;
        if (!classId) return;

        var ua = navigator.userAgent || "";
        var isAndroid = /android/i.test(ua);
        // Detect in-app browsers that block JS redirects
        var isInApp = /telegram|messenger|fbav|instagram|line|whatsapp/i.test(ua);

        // Set the "Open in app" button href
        document.addEventListener("DOMContentLoaded", function () {
          var btn = document.getElementById("open-app-btn");
          if (!btn) return;
          if (isAndroid) {
            btn.href =
              "intent://classes/" +
              classId +
              "#Intent;scheme=weeshway;package=com.weeshway.weeshway;end";
          } else {
            btn.href = "weeshway://classes/" + classId;
          }
        });

        // Only auto-redirect if NOT in an in-app browser
        if (!isInApp) {
          if (isAndroid) {
            window.location.href =
              "intent://classes/" +
              classId +
              "#Intent;scheme=weeshway;package=com.weeshway.weeshway;end";
          } else {
            window.location.href = "weeshway://classes/" + classId;
          }
        }
      })();
    </script>
  </head>
  <body>
    <div class="redirect-page">
      <img src="/assets/icon.webp" alt="WeeshWay" />
      <h1>View this class on WeeshWay</h1>
      <p>Download the app to browse classes, book spots, and start dancing.</p>
      <a id="open-app-btn" href="#" class="open-app-btn">Open in App</a>
      <div class="store-buttons">
        <a href="#" class="store-btn" aria-label="Download on the App Store">
          <svg
            width="20"
            height="24"
            viewBox="0 0 384 512"
            fill="currentColor"
          >
            <path
              d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"
            />
          </svg>
          <div class="store-btn-text">
            <span class="store-btn-small">Download on the</span
            ><span class="store-btn-big">App Store</span>
          </div>
        </a>
        <a href="#" class="store-btn" aria-label="Get it on Google Play">
          <svg
            width="20"
            height="22"
            viewBox="0 0 512 512"
            fill="currentColor"
          >
            <path
              d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"
            />
          </svg>
          <div class="store-btn-text">
            <span class="store-btn-small">Get it on</span
            ><span class="store-btn-big">Google Play</span>
          </div>
        </a>
      </div>
    </div>
  </body>
</html>
